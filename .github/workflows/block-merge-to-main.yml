name: Block Direct PR to Main

on:
  pull_request:
    branches: ["main"]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" != "develop" && "${{ github.head_ref }}" != hotfix/* ]]; then
            echo "❌ ERROR: Pull Requests to 'main' must come from 'develop' or 'hotfix/*'."
            exit 1
          fi
          echo "✅ Source branch is valid."
